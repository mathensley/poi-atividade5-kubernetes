apiVersion: apps/v1
kind: Deployment
metadata:
  name: poi-memory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: poi-memory
  template:
    metadata:
      labels:
        app: poi-memory
    spec:
      containers:
        - name: memory
          image: mathensley/poi-memory-grupo25:1.0
          ports:
            - containerPort: 8002
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: poi-memory
spec:
  type: NodePort
  selector:
    app: poi-memory
  ports:
    - protocol: TCP
      port: 8002
      targetPort: 8002
      nodePort: 30082
