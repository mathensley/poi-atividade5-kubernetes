apiVersion: apps/v1
kind: Deployment
metadata:
  name: poi-io
spec:
  replicas: 1
  selector:
    matchLabels:
      app: poi-io
  template:
    metadata:
      labels:
        app: poi-io
    spec:
      containers:
        - name: io
          image: mathensley/poi-io-grupo25:1.0
          ports:
            - containerPort: 8003
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: poi-io
spec:
  type: NodePort
  selector:
    app: poi-io
  ports:
    - protocol: TCP
      port: 8003
      targetPort: 8003
      nodePort: 30083
